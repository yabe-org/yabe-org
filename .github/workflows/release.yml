name: Build and release

# Builds every component from the submodule commits recorded in this repository.
#   build_rootfs -> build_openxr
#                -> build_xreal_client
#   build_xreal
#   check_aidl
#
# Required secrets:
#   XREAL_SDK_URL              download URL of com.xreal.xr.tgz (Unity SDK 3.1.0)
#   UNITY_LICENSE              contents of Unity_lic.ulf (Personal), or
#   UNITY_SERIAL               serial (Plus/Pro); UNITY_EMAIL and UNITY_PASSWORD are used with it
#   UNITY_EMAIL, UNITY_PASSWORD
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: 29.0.14206865
  UNITY_VERSION: 6000.0.77f1
  UNITY_IMAGE: unityci/editor:ubuntu-6000.0.77f1-android-3

jobs:
  check_aidl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check that the shared AIDL files are identical
        run: |
          diff -r \
            xreal/Assets/Plugins/Android/YabeLib.androidlib/src/main/aidl \
            xreal-client/app/src/main/aidl

  build_rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # `make` needs e2fsprogs >= 1.47.1, which Ubuntu 24.04 does not ship,
      # so it runs in an Arch Linux container. /mnt has far more free space than /.
      - name: Build rootfs
        run: |
          sudo mkdir -p /mnt/rootfs
          sudo chown "$(id -u):$(id -g)" /mnt/rootfs
          cp -a rootfs-builder /mnt/rootfs/
          docker run --rm \
            -v /mnt/rootfs/rootfs-builder:/work -w /work \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed make qemu-system-aarch64 e2fsprogs curl
              make VM_CPUS="$(nproc)" VM_MEM=12G
            '
          ls -lh /mnt/rootfs/rootfs-builder/out
      - name: Show build log on failure
        if: failure()
        run: tail -n 200 /mnt/rootfs/rootfs-builder/out/build.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: /mnt/rootfs/rootfs-builder/out/*.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  build_openxr:
    needs: [build_rootfs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: .github/scripts/free-disk-space.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build bison pkg-config libwayland-bin
          pipx install meson  # libxkbcommon requires meson >= 1.4; Ubuntu 24.04 ships 1.3
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: ${{ runner.temp }}/rootfs
      - run: mv "$RUNNER_TEMP"/rootfs/*.tar.zst openxr/app/assets/image.tar.zst
      - name: Build
        working-directory: openxr
        run: ./gradlew --no-daemon assembleRelease
      - name: Sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          .github/scripts/sign-apk.sh openxr/build/outputs/apk/release/*-release-unsigned.apk dist/yabe-openxr.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-openxr
          path: dist/yabe-openxr.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  build_xreal_client:
    needs: [build_rootfs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: .github/scripts/free-disk-space.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: ${{ runner.temp }}/rootfs
      - run: |
          mkdir -p xreal-client/app/src/main/assets
          mv "$RUNNER_TEMP"/rootfs/*.tar.zst xreal-client/app/src/main/assets/image.tar.zst
      - name: Build
        working-directory: xreal-client
        run: ./gradlew --no-daemon assembleRelease
      - name: Sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          .github/scripts/sign-apk.sh xreal-client/app/build/outputs/apk/release/app-release-unsigned.apk dist/yabe-xreal-client.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-xreal-client
          path: dist/yabe-xreal-client.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  build_xreal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: .github/scripts/free-disk-space.sh
      # The SDK must not be redistributed: it is fetched here, used only inside
      # this job, and never uploaded or cached.
      - name: Fetch XREAL SDK
        env:
          XREAL_SDK_URL: ${{ secrets.XREAL_SDK_URL }}
        run: curl -fsSL -o xreal/Packages/com.xreal.xr.tgz "$XREAL_SDK_URL"
      - name: Build
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work/xreal \
            -e UNITY_VERSION -e UNITY_LICENSE -e UNITY_SERIAL -e UNITY_EMAIL -e UNITY_PASSWORD \
            "$UNITY_IMAGE" \
            bash -uo pipefail -c '
              apt-get update > /dev/null
              apt-get install -y --no-install-recommends make ninja-build bison pkg-config libwayland-bin python3-pip > /dev/null
              pip3 install --break-system-packages meson > /dev/null 2>&1 || pip3 install meson > /dev/null
              if [ -n "${UNITY_SERIAL:-}" ]; then
                unity-editor -batchmode -quit -nographics -logFile - \
                  -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || exit 1
              elif [ -n "${UNITY_LICENSE:-}" ]; then
                printf "%s" "$UNITY_LICENSE" | tr -d "\r" > /tmp/Unity_lic.ulf
                unity-editor -batchmode -quit -nographics -logFile - \
                  -manualLicenseFile /tmp/Unity_lic.ulf || exit 1
              else
                echo "UNITY_LICENSE or UNITY_SERIAL is required" >&2
                exit 1
              fi
              make release-apk UNITY_EXECUTABLE=unity-editor
              status=$?
              cat ~/.config/unity3d/Editor.log 2>/dev/null || true
              if [ -n "${UNITY_SERIAL:-}" ]; then
                unity-editor -batchmode -quit -nographics -logFile - \
                  -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || true
              fi
              exit $status
            '
          test -f xreal/yabe-xreal-release.apk
      - name: Sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          .github/scripts/sign-apk.sh xreal/yabe-xreal-release.apk dist/yabe-xreal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-xreal
          path: dist/yabe-xreal.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish_release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check_aidl, build_openxr, build_xreal_client, build_xreal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.apk
      - name: Write release notes
        run: |
          {
            echo "## Components"
            echo
            echo '```'
            git submodule status
            echo '```'
            echo
            echo "## SHA-256"
            echo
            echo '```'
            (cd dist && sha256sum *.apk)
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
      # Immutability applies on publish, so upload every asset to a draft first.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*.apk
          gh release edit "$TAG" --draft=false

